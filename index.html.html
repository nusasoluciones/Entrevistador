<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Entrevista - UNAM</title>
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --bg: #f4f7f6; }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 10px; background: var(--bg); margin: 0; }
        .card { max-width: 500px; margin: 10px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); font-size: 1.2em; margin: 0 0 5px 0; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 16%; transition: width 0.4s ease; }
        .step { display: none; }
        .step.active { display: block; }
        label { display: block; font-size: 16px; line-height: 1.5; color: var(--dark); margin-bottom: 15px; text-align: justify; }
        b { color: var(--primary); }
        input[type="text"], textarea { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; background: #fff; }
        textarea { resize: none; margin-top: 10px; }
        .btn-container { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        button { width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-next { background: var(--primary); color: white; }
        .btn-next:disabled { background: #bdc3c7; color: #fff; cursor: not-allowed; opacity: 0.7; }
        .btn-final-area { display: none; }
        .btn-download { background: #3498db; color: white; margin-bottom: 10px; }
        .btn-copy { background: var(--dark); color: white; }
        .word-count { font-size: 0.8em; color: #7f8c8d; text-align: right; margin-top: 5px; font-weight: bold; }
        .hint { font-size: 0.85em; color: #e67e22; margin-top: 15px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <div id="header-area">
        <h2>Simulacro Unidad 1</h2>
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    </div>

    <form id="interviewForm" onsubmit="return false;">
        <div class="step active" id="step0">
            <label><b>Identificación:</b><br>Ingresá tus datos para que tu reporte de evidencia sea válido.</label>
            <input type="text" id="nombre" placeholder="Tu Nombre" oninput="validarID()">
            <input type="text" id="apellido" placeholder="Tu Apellido" style="margin-top:10px" oninput="validarID()">
            <div class="btn-container">
                <button type="button" id="btn0" class="btn-next" onclick="cambiarPaso(1)" disabled>Iniciar Simulación</button>
            </div>
        </div>

        <div class="step" id="step1">
            <label>1. Llegas a la base en Añelo. El equipo tiene un retraso de 48h. Tu <b>supervisor</b> te ordena <b>que los obligues</b> a terminar hoy sea como sea. El capataz (30 años de experiencia) te frena y dice: <i>"Mirá, pibe, si forzamos la máquina ahora, se rompe y nos quedamos todos sin laburo"</i>.<br><br><b>¿Qué palabras exactas le decís al capataz para intentar cumplir la orden de tu supervisor sin perder el respeto del equipo?</b></label>
            <textarea id="q1" rows="5" oninput="validarP(1)"></textarea>
            <div id="count1" class="word-count">Palabras: 0 / mín. 35</div>
            <div class="btn-container"><button type="button" id="btn1" class="btn-next" onclick="cambiarPaso(2)" disabled>Siguiente Situación</button></div>
        </div>

        <div class="step" id="step2">
            <label>2. Detectás una fuga de gas menor. Tu <b>supervisor</b> te ordena por radio: <i>"Ignoralo, seguí operando, no podemos parar ahora por una pavada así"</i>. Sabés que si lo ignorás rompes el protocolo de seguridad (HSE), pero si lo informás por escrito, dejás expuesto a tu <b>supervisor</b> ante la gerencia.<br><br><b>Redactá el mensaje de texto o correo para fijar tu postura ante el supervisor sin que parezca una amenaza. ¿Lo registrás en el sistema oficial (SAP)? Justificá.</b></label>
            <textarea id="q2" rows="6" oninput="validarP(2)"></textarea>
            <div id="count2" class="word-count">Palabras: 0 / mín. 35</div>
            <div class="btn-container"><button type="button" id="btn2" class="btn-next" onclick="cambiarPaso(3)" disabled>Siguiente Situación</button></div>
        </div>

        <div class="step" id="step3">
            <label>3. Por un error de carga tuyo en SAP, enviaste un camión a una base equivocada ($5.000 de costo extra). Tu <b>supervisor</b> todavía no lo sabe, pero el cliente ya reclama los materiales de forma urgente.<br><br><b>Redactá el asunto y los primeros dos párrafos del mail que le enviarías a tu supervisor informando el error de forma inmediata. Sin excusas ni culpar al sistema.</b></label>
            <textarea id="q3" rows="5" oninput="validarP(3)"></textarea>
            <div id="count3" class="word-count">Palabras: 0 / mín. 35</div>
            <div class="btn-container"><button type="button" id="btn3" class="btn-next" onclick="cambiarPaso(4)" disabled>Siguiente Situación</button></div>
        </div>

        <div class="step" id="step4">
            <label>4. 3ra semana en el tráiler en Añelo: sin señal, 5 grados bajo cero y equipo desmotivado. Un compañero te dice: <i>"Para qué nos esforzamos tanto si para esta empresa no les importamos nada"</i>.<br><br><b>¿Qué acción concreta (un hecho, no solo palabras) harías mañana a primera hora para demostrar liderazgo y que el equipo recupere el foco?</b></label>
            <textarea id="q4" rows="5" oninput="validarP(4)"></textarea>
            <div id="count4" class="word-count">Palabras: 0 / mín. 35</div>
            <div class="btn-container"><button type="button" id="btn4" class="btn-next" onclick="cambiarPaso(5)" disabled>Siguiente Situación</button></div>
        </div>

        <div class="step" id="step5">
            <label>5. El reclutador te dice: <i>"Tengo 100 CVs iguales al tuyo. Todos dicen que saben PowerBI"</i>.<br><br><b>¿Qué habilidad o actitud que NO esté escrita en tu CV te hace el candidato ideal para aguantar la presión de Vaca Muerta? Convenceme con un argumento potente de dos oraciones.</b></label>
            <textarea id="q5" rows="4" oninput="validarP(5)"></textarea>
            <div id="count5" class="word-count">Palabras: 0 / mín. 35</div>
            
            <div class="btn-container btn-final-area" id="finalBtns">
                <button type="button" class="btn-download" onclick="descargar()">1. DESCARGAR EVIDENCIA (.txt)</button>
                <button type="button" class="btn-copy" onclick="copiar()">2. COPIAR PARA IA</button>
                <p class="hint">Descargá tu evidencia y luego copiala para la IA.</p>
            </div>
        </div>
    </form>
</div>

<script>
    let pasoActual = 0;
    const minW = 35;

    function validarID() {
        const n = document.getElementById('nombre').value.trim();
        const a = document.getElementById('apellido').value.trim();
        document.getElementById('btn0').disabled = (n.length < 2 || a.length < 2);
    }

    function validarP(n) {
        const txt = document.getElementById('q'+n).value.trim();
        const words = txt ? txt.split(/\s+/).filter(w => w.length > 0).length : 0;
        document.getElementById('count'+n).innerText = `Palabras: ${words} / mín. ${minW}`;
        if(n < 5) { document.getElementById('btn'+n).disabled = (words < minW); }
        else { document.getElementById('finalBtns').style.display = (words >= minW) ? 'block' : 'none'; }
    }

    function cambiarPaso(n) {
        document.querySelectorAll('.step').forEach(s => s.style.display = 'none');
        document.getElementById('step' + n).style.display = 'block';
        pasoActual = n;
        document.getElementById('progress').style.width = ((pasoActual + 1) / 6) * 100 + "%";
        window.scrollTo(0, 0);
    }

    function getFullText(conPrompt) {
        const nom = document.getElementById('nombre').value.toUpperCase();
        const ape = document.getElementById('apellido').value.toUpperCase();
        
        const prompt = `Actúa como un Mentor Senior de Ingeniería Industrial en Vaca Muerta. Estás evaluando a un ingresante de 1er año que simula ser un graduado. Tu tono es exigente y realista, pero orientador.

TAREA:
1. Analiza las siguientes respuestas bajo el modelo del 'Iceberg Profesional'. 
2. Para cada una de las situaciones, Habla de Habilidades Blandas (Comunicación, Ética, Liderazgo, Responsabilidad) según sea el caso y hazlo de forma clara y directa. No pase su respuesta en forma de tabla. Debe tener suficiente contenido para que el alumno comprenda adecuadamente.
3. Señala qué pasaría en la realidad del campo con su respuesta (sé honesto y duro si es necesario).
4. EN LUGAR DE NOMBRAR MATERIAS, sugiere 3 ACCIONES CONCRETAS que el alumno puede hacer durante su carrera universitaria para mejorar en habilidades blandas (ej: unirse a grupos de estudiantes, buscar roles de liderazgo en proyectos, realizar voluntariados, tomar talleres de comunicación, etc.).
5. Finaliza vinculando su desempeño con la Paradoja de la Automatización: explica que su valor futuro como ingeniero será aportar el criterio humano que un sistema automatizado no posee.\n\nRESPUESTAS:\n`;

        let res = conPrompt ? prompt : `EVIDENCIA UNIDAD 1: ${ape}, ${nom}\n---------------------------------------\n`;
        for(let i=1; i<=5; i++) { res += `SITUACIÓN ${i}: ${document.getElementById('q'+i).value}\n\n`; }
        return res;
    }

    function descargar() {
        const blob = new Blob([getFullText(false)], { type: 'text/plain' });
        const a = document.createElement('a');
        a.download = `Unidad1_${document.getElementById('apellido').value}.txt`;
        a.href = URL.createObjectURL(blob);
        a.click();
    }

    function copiar() {
        const txt = getFullText(true);
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(() => alert("¡Copiado! Pégalo en ChatGPT o Gemini."));
        } else {
            const temp = document.createElement("textarea");
            temp.value = txt; document.body.appendChild(temp);
            temp.select(); document.execCommand("copy");
            document.body.removeChild(temp);
            alert("¡Copiado! Pégalo en la IA.");
        }
    }
</script>
</body>
</html>
